# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Coverage rationale, in blast-radius order:
#
#   gradle          -> compiles INTO the APK that users install. Highest impact.
#   github-actions  -> every action is SHA-pinned (deliberately, so a moved tag
#                      cannot swap the code under us). A SHA pin never updates
#                      itself, so without this ecosystem a pinned action silently
#                      rots. Dependabot rewrites the SHA *and* the version comment.
#   cargo           -> the native build toolchain. Mostly build-time only: pb-rs
#                      and cxx-gen run on the build host and ship nothing. Real
#                      but lower impact -- GHSA-g98v-hv3f-hcfr (atty) was this.
#
# Grouping keeps a solo maintainer's review queue survivable: routine
# patch/minor bumps arrive as one PR per ecosystem, while majors stay separate
# so a breaking change is never buried in a batch.

version: 2
updates:
  # --- Ships inside the APK -------------------------------------------------
  # ONE root entry, deliberately. Gradle's updater resolves the whole build from
  # the root -- a single scan already reaches app/, buildSrc/, stub/ and native/.
  # Listing those subdirectories as well made it scan the same manifests again
  # and open a second, identical PR for every bump (four duplicate pairs on the
  # first run: Retrofit, OkHttp, AGP and jgit each arrived twice).
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      gradle-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    # The embedded Kotlin 1.9 compiler, SDK 34 and Android 6/API 23 floor
    # are a coordinated compatibility boundary, not independent version bumps.
    # Evidence and the migration checklist are in MAINTAINER.md.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "androidx.room:*"
        versions: [">=2.8.0"]
      - dependency-name: "androidx.navigation:navigation-fragment-ktx"
        versions: [">=2.10.0"]
      - dependency-name: "androidx.navigation:navigation-ui-ktx"
        versions: [">=2.10.0"]
      - dependency-name: "androidx.navigation:navigation-safe-args-gradle-plugin"
        versions: [">=2.10.0"]
      - dependency-name: "androidx.appcompat:appcompat"
        versions: [">=1.8.0"]
      - dependency-name: "androidx.fragment:fragment-ktx"
        versions: [">=1.9.0"]
      - dependency-name: "androidx.core:core-ktx"
        versions: [">=1.15.0"]
      - dependency-name: "androidx.recyclerview:recyclerview"
        versions: [">=1.4.0"]
      - dependency-name: "androidx.swiperefreshlayout:swiperefreshlayout"
        versions: [">=1.2.0"]
      - dependency-name: "androidx.transition:transition"
        versions: [">=1.6.0"]
      - dependency-name: "androidx.core:core-splashscreen"
        versions: [">=1.2.0"]
      - dependency-name: "com.google.android.material:material"
        versions: [">=1.14.0"]
      # This particular version is absent from every configured repository.
      # Do not suppress later releases if the publisher fixes the artifact.
      - dependency-name: "dev.rikka.rikkax.recyclerview:recyclerview-ktx"
        versions: ["1.4.0"]
    commit-message:
      prefix: "deps(gradle)"

  # --- Builds and signs the APK ---------------------------------------------
  # Keeps the SHA pins in .github/workflows and .github/actions current.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/setup"
      - "/.github/actions/publish-pages"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(actions)"

  # --- Native build toolchain -----------------------------------------------
  - package-ecosystem: "cargo"
    directory: "/native/src"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(cargo)"
