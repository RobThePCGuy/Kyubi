# Kyubi CI — builds the emulator-only (x86/x86_64, system-mode) Magisk fork,
# smoke-tests the APK, and publishes a versioned GitHub Release on kitsune pushes.
#
# Third-party actions are pinned to a full commit SHA (supply-chain safety for a
# root-management tool); the trailing comment is the human-readable version.
name: Kyubi CI

on:
  push:
    branches:
      - dev
      - kitsune
  pull_request:
  workflow_dispatch:

# Least privilege: read-only by default (PR/dev/manual/smoke jobs execute
# repo-controlled build code). Only the release job elevates to contents: write.
permissions:
  contents: read

env:
  # SHA-256 of the Kyubi release signing certificate (CN=Kyubi, O=RobThePCGuy).
  # Single source of truth: the stub's DynLoad pin is checked against this in CI
  # (see "Verify cert pin is single-source"). On key rotation, update BOTH.
  KYUBI_CERT_SHA256: "7ad4f68f776d56a9bedfdc02f32cd68ac3bb0531a862817eb17c1c243e482303"

jobs:
  build:
    name: Build Kyubi APKs
    runs-on: ubuntu-latest
    env:
      SCCACHE_DIRECT: false
    strategy:
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup

      # Fail fast if the stub's compiled-in cert pin drifts from the workflow pin.
      - name: Verify cert pin is single-source
        run: |
          STUB_PIN="$(grep -oE '[0-9a-f]{64}' stub/src/main/java/com/topjohnwu/magisk/DynLoad.java | head -1)"
          if [ "$STUB_PIN" != "$KYUBI_CERT_SHA256" ]; then
            echo "::error::DynLoad pin ($STUB_PIN) != workflow pin ($KYUBI_CERT_SHA256)" >&2
            exit 1
          fi
          echo "cert pin single-source OK: $STUB_PIN"

      # Release signing secrets are exposed ONLY on a kitsune push (this step is
      # skipped for PRs, dev, and manual runs, so those never receive the key).
      # Fail CLOSED: a kitsune push with no secret must not produce a release.
      - name: Set up release signing
        if: github.ref == 'refs/heads/kitsune' && github.event_name == 'push'
        env:
          KEYSTORE_B64: ${{ secrets.KYUBI_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KYUBI_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KYUBI_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KYUBI_KEY_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Release signing secrets are missing on a kitsune push -- refusing to build an unsigned release." >&2
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > kyubi-release.jks
          {
            echo "keyStore=kyubi-release.jks"
            echo "keyStorePass=$KEYSTORE_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPass=$KEY_PASS"
          } >> config.prop
          echo "Release signing configured from secrets."

      # Keep the Kitsune core lineage but append the short SHA so the APK reports
      # a distinct, verifiable version matching its release tag. versionCode stays
      # 31000 (Magisk feature gates depend on it).
      - name: Embed build commit in version name
        run: |
          SHA="$(git rev-parse --short=8 HEAD)"
          sed -i "s/^version=.*/version=31.0-kitsune.${SHA}/" config.prop
          grep '^version=' config.prop

      - name: Build release
        run: ./build.py -vr all

      # The release key must NEVER sign a debug build. Strip the signing config
      # (and delete the keystore) before the debug build so debug is debug-signed.
      - name: Remove release signing before debug build
        if: github.ref == 'refs/heads/kitsune' && github.event_name == 'push'
        run: |
          sed -i '/^keyStore/d;/^keyStorePass/d;/^keyAlias/d;/^keyPass/d' config.prop
          rm -f kyubi-release.jks

      - name: Build debug
        run: ./build.py -v all

      # Certificate gate: release APKs MUST carry the pinned Kyubi cert; debug
      # APKs MUST NOT (they bypass the stub cert check, so a production-signed
      # debug build would be dangerous).
      - name: Verify signing certificates
        if: github.ref == 'refs/heads/kitsune' && github.event_name == 'push'
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          cert() { "$APKSIGNER" verify --print-certs "$1" 2>/dev/null \
            | grep -iE 'certificate SHA-256 digest' | head -1 | awk '{print $NF}'; }
          for apk in out/app-release.apk out/stub-release.apk; do
            got="$(cert "$apk")"
            if [ "$got" != "$KYUBI_CERT_SHA256" ]; then
              echo "::error::$apk signing cert $got != pinned Kyubi cert" >&2; exit 1
            fi
            echo "$apk: release cert OK ($got)"
          done
          for apk in out/app-debug.apk out/stub-debug.apk; do
            got="$(cert "$apk")"
            if [ "$got" = "$KYUBI_CERT_SHA256" ]; then
              echo "::error::$apk is production-signed -- debug builds must not use the release key" >&2; exit 1
            fi
            echo "$apk: debug cert correctly NOT the release key"
          done

      - name: Stop gradle daemon
        run: ./gradlew --stop

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.sha }}
          path: out
          compression-level: 9

      - name: Upload mapping and native debug symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.sha }}-symbols
          path: app/build/outputs
          compression-level: 9

  # Gate: assert Kyubi's build invariants on the release APK, then install and
  # launch it on a stock x86_64 emulator. Both must pass before a release ships.
  # This does NOT test the offline system-mode root install (BlueStacks-VHD
  # specific, not reproducible on a stock AVD) -- that is validated on real
  # instances.
  smoke:
    name: Smoke test (APK shape + emulator launch)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ github.sha }}
          path: out

      - name: Assert Kyubi build invariants
        run: |
          chmod +x scripts/kyubi_smoke.sh scripts/kyubi_emulator_smoke.sh
          ./scripts/kyubi_smoke.sh out/app-release.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install + launch on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./scripts/kyubi_emulator_smoke.sh

  # Publish ONLY on a kitsune push, and ONLY after build + smoke both pass. The
  # APKs are the ones built (and signed) in `build` -- downloaded, not rebuilt.
  # Rolling per-commit builds are marked prerelease: CI cannot validate the
  # offline system-mode root install, so a build is only a candidate until it
  # passes the real BlueStacks system-mode test on an emulator instance. Promote
  # a validated commit to a full release by tagging a stable kyubi-x.y.z.
  release:
    name: Publish release
    needs: [build, smoke]
    if: github.ref == 'refs/heads/kitsune' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ github.sha }}
          path: out

      # Tag = v31.0-<short commit>: v31.0 tracks magisk.versionCode=31000, and the
      # short SHA is the build suffix embedded in the APK's version name
      # (31.0-kitsune.<sha>), so the tag and the reported version agree.
      - name: Compute version tag
        id: ver
        run: echo "tag=v31.0-$(echo '${{ github.sha }}' | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Kyubi ${{ steps.ver.outputs.tag }}
          prerelease: true
          fail_on_unmatched_files: false
          body: |
            **Kyubi** rolling build — commit `${{ github.sha }}` (versionCode 31000).
            Emulator-only Magisk (Magisk Delta / Kitsune lineage), system-mode install.
            The APK's version name is `31.0-kitsune.<short-sha>`, ending with the same
            short commit SHA as this tag, so the tag and the installed version agree.

            Prerelease: CI verifies the build shape and that it installs/launches, but
            does NOT run the offline system-mode root install (BlueStacks-specific).
            Treat as a candidate until validated on a real emulator instance.

            x86 + x86_64 only — no ARM, no `magiskboot`/boot-image path. Built-in
            Zygisk is removed for security; use ReZygisk (Kyubi's DenyList feeds it).
            Only the cert-verified release APKs are attached; debug APKs stay private.

            - `app-release.apk` — Kyubi manager (install this)
            - `stub-release.apk` — cert-pinned hidden-manager stub
          files: |
            out/app-release.apk
            out/stub-release.apk
