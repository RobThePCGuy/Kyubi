# Kyubi CI — builds the emulator-only (x86/x86_64, system-mode) Magisk fork,
# smoke-tests the APK, and publishes a versioned GitHub Release on kitsune pushes.
#
# Third-party actions are pinned to a full commit SHA (supply-chain safety for a
# root-management tool); the trailing comment is the human-readable version.
name: Kyubi CI

on:
  push:
    branches:
      - dev
      - kitsune
  pull_request:
  workflow_dispatch:

# Least privilege: read-only by default (PR/dev/manual/smoke jobs execute
# repo-controlled build code). Only the release job elevates to contents: write.
permissions:
  contents: read

env:
  # SHA-256 of the Kyubi release signing certificate (CN=Kyubi, O=RobThePCGuy).
  # Single source of truth: the stub's DynLoad pin is checked against this in CI
  # (see "Verify cert pin is single-source"). On key rotation, update BOTH.
  KYUBI_CERT_SHA256: "7ad4f68f776d56a9bedfdc02f32cd68ac3bb0531a862817eb17c1c243e482303"

jobs:
  build:
    name: Build Kyubi APKs
    runs-on: ubuntu-latest
    env:
      SCCACHE_DIRECT: false
    strategy:
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup

      # Fail fast if the stub's compiled-in cert pin drifts from the workflow pin.
      - name: Verify cert pin is single-source
        run: |
          STUB_PIN="$(grep -oE '[0-9a-f]{64}' stub/src/main/java/com/topjohnwu/magisk/DynLoad.java | head -1)"
          if [ "$STUB_PIN" != "$KYUBI_CERT_SHA256" ]; then
            echo "::error::DynLoad pin ($STUB_PIN) != workflow pin ($KYUBI_CERT_SHA256)" >&2
            exit 1
          fi
          echo "cert pin single-source OK: $STUB_PIN"

      # Release signing secrets are exposed ONLY on a kitsune push (this step is
      # skipped for PRs, dev, and manual runs, so those never receive the key).
      # Fail CLOSED: a kitsune push with no secret must not produce a release.
      - name: Set up release signing
        if: github.ref == 'refs/heads/kitsune' && github.event_name == 'push'
        env:
          KEYSTORE_B64: ${{ secrets.KYUBI_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KYUBI_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KYUBI_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KYUBI_KEY_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Release signing secrets are missing on a kitsune push -- refusing to build an unsigned release." >&2
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > kyubi-release.jks
          {
            echo "keyStore=kyubi-release.jks"
            echo "keyStorePass=$KEYSTORE_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPass=$KEY_PASS"
          } >> config.prop
          echo "Release signing configured from secrets."

      # Keep the Kitsune core lineage but append the short SHA so the APK reports
      # a distinct, verifiable version matching its release tag. versionCode stays
      # 31000 (Magisk feature gates depend on it).
      - name: Embed build commit in version name
        run: |
          SHA="$(git rev-parse --short=8 HEAD)"
          sed -i "s/^version=.*/version=31.0-kitsune.${SHA}/" config.prop
          grep '^version=' config.prop

      - name: Build release
        run: ./build.py -vr all

      # The release key must NEVER sign a debug build. Strip the signing config
      # (and delete the keystore) before the debug build so debug is debug-signed.
      - name: Remove release signing before debug build
        if: github.ref == 'refs/heads/kitsune' && github.event_name == 'push'
        run: |
          sed -i '/^keyStore/d;/^keyStorePass/d;/^keyAlias/d;/^keyPass/d' config.prop
          rm -f kyubi-release.jks

      - name: Build debug
        run: ./build.py -v all

      # Certificate gate: release APKs MUST carry the pinned Kyubi cert; debug
      # APKs MUST NOT (they bypass the stub cert check, so a production-signed
      # debug build would be dangerous).
      - name: Verify signing certificates
        if: github.ref == 'refs/heads/kitsune' && github.event_name == 'push'
        run: |
          set -o pipefail
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          # ALL signer cert SHA-256 digests, one per line (nonzero if apksigner
          # verification itself fails -- pipefail propagates it).
          certs() { "$APKSIGNER" verify --print-certs "$1" 2>/dev/null \
            | grep -iE 'certificate SHA-256 digest' | awk '{print $NF}'; }
          # Release: apksigner must verify, at least one signer, and EVERY signer
          # must be the pinned Kyubi cert (mirrors DynLoad's all-signers check).
          for apk in out/app-release.apk out/stub-release.apk; do
            digs="$(certs "$apk")" || { echo "::error::apksigner verification failed for $apk" >&2; exit 1; }
            [ -n "$digs" ] || { echo "::error::no signer certificate found in $apk" >&2; exit 1; }
            while read -r d; do
              [ "$d" = "$KYUBI_CERT_SHA256" ] || { echo "::error::$apk signer $d != pinned Kyubi cert" >&2; exit 1; }
            done <<< "$digs"
            echo "$apk: all release signers == Kyubi pin"
          done
          # Debug: must verify, have signer(s), and NO signer may be the release key.
          for apk in out/app-debug.apk out/stub-debug.apk; do
            digs="$(certs "$apk")" || { echo "::error::apksigner verification failed for $apk" >&2; exit 1; }
            [ -n "$digs" ] || { echo "::error::no signer certificate found in $apk" >&2; exit 1; }
            while read -r d; do
              [ "$d" != "$KYUBI_CERT_SHA256" ] || { echo "::error::$apk is production-signed -- debug must not use the release key" >&2; exit 1; }
            done <<< "$digs"
            echo "$apk: debug signer(s) present and none is the release key"
          done

      - name: Stop gradle daemon
        run: ./gradlew --stop

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.sha }}
          path: out
          compression-level: 9

      - name: Upload mapping and native debug symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.sha }}-symbols
          path: app/build/outputs
          compression-level: 9

  # Gate: assert Kyubi's build invariants on the release APK, then install and
  # launch it on a stock x86_64 emulator. Both must pass before a release ships.
  # This does NOT test the offline system-mode root install (BlueStacks-VHD
  # specific, not reproducible on a stock AVD) -- that is validated on real
  # instances.
  smoke:
    name: Smoke test (APK shape + emulator launch)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ github.sha }}
          path: out

      - name: Assert Kyubi build invariants
        run: |
          chmod +x scripts/kyubi_smoke.sh scripts/kyubi_emulator_smoke.sh
          ./scripts/kyubi_smoke.sh out/app-release.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install + launch on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./scripts/kyubi_emulator_smoke.sh

  # Publish ONLY on a kitsune push, and ONLY after build + smoke both pass. The
  # APKs are the ones built (and signed) in `build` -- downloaded, not rebuilt.
  # Rolling per-commit builds are marked prerelease: CI cannot validate the
  # offline system-mode root install, so a build is only a candidate until it
  # passes the real BlueStacks system-mode test on an emulator instance. A stable
  # release is cut MANUALLY after that validation (no tag-triggered job yet; see
  # MAINTAINER.md).
  release:
    name: Publish release
    needs: [build, smoke]
    if: github.ref == 'refs/heads/kitsune' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    # Both this job and promote.yml write the gh-pages branch. queue: single (the
    # default) keeps only ONE pending member and cancels the previous one, which
    # would silently drop a feed write. queue: max cannot be combined with
    # cancel-in-progress: true.
    concurrency:
      group: kyubi-feed
      cancel-in-progress: false
      queue: max
    steps:
      # Sparse: this job needs only the composite action, not the source tree.
      # path: repo keeps it clear of out/ (artifacts) and site/ (gh-pages).
      - name: Check out composite actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          path: repo
          persist-credentials: false

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ github.sha }}
          path: out

      # persist-credentials: true is a deliberate exception to the repo-wide
      # convention -- this job pushes the feed. It already holds contents: write,
      # so this is not a privilege escalation.
      - name: Check out gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: site
          persist-credentials: true

      # Tag = v31.0-<short commit>: v31.0 tracks magisk.versionCode=31000, and the
      # short SHA is the build suffix embedded in the APK's version name
      # (31.0-kitsune.<sha>), so the tag and the reported version agree.
      - name: Compute version tag
        id: ver
        run: echo "tag=v31.0-$(echo '${{ github.sha }}' | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Validate build code against the published feed
        id: feed
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          comment="$(unzip -z out/app-release.apk)"
          BUILD_CODE="$(echo "$comment" | sed -n 's/^buildCode=\([0-9]*\)$/\1/p')"
          VERSION="$(echo "$comment" | sed -n 's/^version=\(.*\)$/\1/p')"
          [ -n "$BUILD_CODE" ] || { echo "::error::no buildCode in APK comment" >&2; exit 1; }
          [ -n "$VERSION" ]    || { echo "::error::no version in APK comment" >&2; exit 1; }
          LINK="https://github.com/RobThePCGuy/Kyubi/releases/download/${TAG}/app-release.apk"

          # A missing prerelease.json is NOT treated as a fresh start -- an
          # accidental deletion would reset the monotonic barrier. Both feeds are
          # seeded once by hand (see the rollout task).
          [ -f site/prerelease.json ] || { echo "::error::prerelease.json missing -- seed it first" >&2; exit 1; }
          PREV="$(jq -er '.kyubi.buildCode' site/prerelease.json)" \
            || { echo "::error::prerelease.json malformed" >&2; exit 1; }

          # Three outcomes, so that a rerun after a failed Pages build can finish
          # instead of failing permanently on equality.
          if [ "$BUILD_CODE" -gt "$PREV" ]; then
            echo "new build $BUILD_CODE (published $PREV)"
          elif [ "$BUILD_CODE" -eq "$PREV" ]; then
            PREV_VER="$(jq -er '.kyubi.version' site/prerelease.json)"
            PREV_LINK="$(jq -er '.kyubi.link' site/prerelease.json)"
            if [ "$PREV_VER" = "$VERSION" ] && [ "$PREV_LINK" = "$LINK" ]; then
              echo "rerun: feed already describes this exact build"
            else
              echo "::error::buildCode $BUILD_CODE already published for a different build" >&2
              exit 1
            fi
          else
            echo "::error::buildCode $BUILD_CODE < published $PREV -- lineage regressed" >&2
            exit 1
          fi

          {
            echo "build_code=$BUILD_CODE"
            echo "version=$VERSION"
            echo "link=$LINK"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Kyubi ${{ steps.ver.outputs.tag }}
          prerelease: true
          fail_on_unmatched_files: false
          body: |
            **Kyubi** rolling build — commit `${{ github.sha }}` (versionCode 31000).
            Emulator-only Magisk (Magisk Delta / Kitsune lineage), system-mode install.
            The APK's version name is `31.0-kitsune.<short-sha>`, ending with the same
            short commit SHA as this tag, so the tag and the installed version agree.

            Prerelease: CI verifies the build shape and that it installs/launches, but
            does NOT run the offline system-mode root install (BlueStacks-specific).
            Treat as a candidate until validated on a real emulator instance.

            x86 + x86_64 only — no ARM, no `magiskboot`/boot-image path. Built-in
            Zygisk is removed for security; use ReZygisk (Kyubi's DenyList feeds it).
            Only the cert-verified release APKs are attached; debug APKs stay private.

            - `app-release.apk` — Kyubi manager (install this)
            - `stub-release.apk` — cert-pinned hidden-manager stub
          files: |
            out/app-release.apk
            out/stub-release.apk

      - name: Write prerelease feed
        id: push
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          BUILD_CODE: ${{ steps.feed.outputs.build_code }}
          VERSION: ${{ steps.feed.outputs.version }}
          LINK: ${{ steps.feed.outputs.link }}
        run: |
          set -euo pipefail
          mkdir -p site/notes
          printf '## Kyubi %s\n\nRolling prerelease built from `%s` (buildCode %s).\n\nCI verifies the build shape and that it installs and launches. The offline\nsystem-mode root install is validated separately on a real instance, so treat\nthis as a candidate until promoted.\n' \
            "$TAG" "$GITHUB_SHA" "$BUILD_CODE" > "site/notes/${TAG}.md"

          jq -n --arg v "$VERSION" --argjson b "$BUILD_CODE" --arg l "$LINK" --arg t "$TAG" \
            '{kyubi:{version:$v,buildCode:$b,link:$l,
               note:("https://robthepcguy.github.io/Kyubi/notes/"+$t+".md")}}' \
            > site/prerelease.json

          cd site
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prerelease.json "notes/${TAG}.md"
          if git diff --cached --quiet; then
            echo "feed already current -- no commit needed"
          else
            git commit -m "feed: prerelease ${TAG} (buildCode ${BUILD_CODE})"
            git push
          fi
          echo "pages_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish Pages build
        uses: ./repo/.github/actions/publish-pages
        with:
          pages-sha: ${{ steps.push.outputs.pages_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
