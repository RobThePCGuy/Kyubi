name: Magisk Setup
# Third-party actions are pinned to a full commit SHA (not a moving tag) for
# supply-chain safety on software that manages root -- the trailing comment is
# the human-readable version. All pins target Node 24 runtimes.
runs:
  using: "composite"
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: "temurin"
        java-version: "17"

    - name: Set up Python 3
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.x"

    - name: Set up sccache
      uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
      with:
        variant: sccache
        key: ${{ runner.os }}-${{ github.sha }}
        restore-keys: ${{ runner.os }}
        max-size: 10000M

    - name: Cache Gradle dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          !~/.gradle/caches/build-cache-*
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
        restore-keys: ${{ runner.os }}-gradle-

    - name: Cache build cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/caches/build-cache-*
        key: ${{ runner.os }}-build-cache-${{ github.sha }}
        restore-keys: ${{ runner.os }}-build-cache-

    - name: Set up NDK
      run: python build.py -v ndk
      shell: bash
